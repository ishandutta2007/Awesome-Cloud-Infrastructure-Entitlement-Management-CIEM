<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 300"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/><stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseNode{0%{transform:scale(1);opacity:.4}50%{transform:scale(1.3);opacity:.9}}@keyframes floatCard{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#titleGrad)}.subtitle{font-weight:500;font-size:18px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#f8fafc}.node{animation:pulseNode 4s infinite ease-in-out;transform-origin:center}.node-delay-1{animation-delay:1s}.node-delay-2{animation-delay:2s}.floating-bg{animation:floatCard 6s infinite ease-in-out}.connecting-line{stroke:#4f46e5;stroke-width:1.5;stroke-dasharray:6 4;animation:dashMove 3s linear infinite;opacity:.5}</style><rect width="1200" height="300" fill="url(#bg)" rx="16"/><g class="floating-bg" opacity=".6"><circle cx="150" cy="80" r="60" fill="#38bdf8" filter="url(#glow)" opacity=".15"/><circle cx="1050" cy="220" r="90" fill="#c084fc" filter="url(#glow)" opacity=".15"/></g><g opacity=".35"><line x1="100" x2="250" y1="220" y2="250" class="connecting-line"/><line x1="250" x2="400" y1="250" y2="210" class="connecting-line"/><line x1="800" x2="950" y1="80" y2="120" class="connecting-line"/><line x1="950" x2="1100" y1="120" y2="60" class="connecting-line"/><circle cx="100" cy="220" r="6" fill="#38bdf8" class="node"/><circle cx="250" cy="250" r="8" fill="#818cf8" class="node node-delay-1"/><circle cx="400" cy="210" r="5" fill="#c084fc" class="node node-delay-2"/><circle cx="800" cy="80" r="7" fill="#38bdf8" class="node node-delay-1"/><circle cx="950" cy="120" r="6" fill="#818cf8" class="node node-delay-2"/><circle cx="1100" cy="60" r="8" fill="#c084fc" class="node"/></g><rect width="1160" height="260" x="20" y="20" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" rx="12"/><g transform="translate(60, 75)"><rect width="230" height="30" x="0" y="0" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" rx="15"/><text x="15" y="20" fill="#38bdf8" class="badge-text">🔒 CLOUD SECURITY &amp; IAM</text><text x="0" y="75" class="title">Awesome CIEM Ecosystem</text><text x="0" y="115" class="subtitle">Cloud Infrastructure Entitlement Management • Permissions Analysis • Least-Privilege</text><g transform="translate(0, 140)"><rect width="140" height="32" x="0" y="0" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="15" y="21" class="badge-text">☁️ Multi-Cloud</text><rect width="165" height="32" x="152" y="0" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="167" y="21" class="badge-text">🔐 Identity Risk</text><rect width="175" height="32" x="329" y="0" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" rx="8"/><text x="344" y="21" class="badge-text">🔓 Open Source &amp; SaaS</text></g></g></svg>